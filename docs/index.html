<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c24">
  <title>Carrera de la competencia</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #10251b;
      color: #f3f8f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #214a31, #10251b 70%);
    }

    main { width: min(1100px, 94vw); margin: 0 auto; padding: 3rem 0 4rem; }
    header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.04em; }
    header p { color: #b7cbbd; margin: .55rem 0 0; }
    .status { color: #c4d7ca; font-size: .9rem; }

    .track {
      margin-top: 2rem;
      padding: .8rem;
      overflow: hidden;
      border: 1px solid #76927a;
      border-radius: 1.2rem;
      background-color: #28643b;
      background-image:
        repeating-linear-gradient(105deg, transparent 0 18px, #ffffff08 19px 21px),
        repeating-linear-gradient(0deg, #ffffff0a 0 2px, transparent 2px 6px);
      background-size: 80px 100%, 100% 100%;
      animation: grass 1.2s linear infinite;
      box-shadow: 0 1.5rem 4rem #0005;
    }

    @keyframes grass { to { background-position: 80px 0, 0 0; } }

    .lane {
      position: relative;
      height: 112px;
      border-bottom: 2px dashed #e6f4df55;
    }

    .lane:last-child { border-bottom: 0; }

    .lane::after {
      content: "";
      position: absolute;
      inset: 0 0 0 auto;
      width: 5px;
      border-left: 2px solid #fff9;
      border-right: 2px solid #fff9;
      background: #fff3;
    }

    .runner {
      position: absolute;
      z-index: 1;
      top: 10px;
      left: clamp(2.5rem, var(--progress), calc(100% - 2.5rem));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
      width: max-content;
      max-width: 9rem;
      transform: translateX(-50%);
      transition: left 1.1s cubic-bezier(.2, .8, .25, 1);
    }

    .name {
      overflow: hidden;
      max-width: 9rem;
      color: white;
      font-size: .9rem;
      font-weight: 750;
      text-overflow: ellipsis;
      text-shadow: 0 2px 5px #10251b;
      white-space: nowrap;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #dce9df;
      box-shadow: 0 3px 8px #0006;
    }

    .score {
      color: white;
      font-size: .77rem;
      font-weight: 700;
      text-shadow: 0 1px 4px #10251b;
    }

    .rank {
      position: absolute;
      top: 35px;
      left: 12px;
      color: #fff9;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .empty {
      padding: 3rem 1rem;
      text-align: center;
      color: #e0eee3;
    }

    .updates { margin-top: 2rem; }
    .updates h2 { font-size: 1.15rem; }
    .updates ul { display: grid; gap: .55rem; padding: 0; list-style: none; }
    .updates li { color: #d2e3d6; }
    .updates time { color: #9eb4a3; font-size: .85rem; }

    .overtake { animation: overtake .9s ease-out; }
    .celebrate .avatar { animation: celebrate .9s ease-in-out; }
    @keyframes overtake { 50% { filter: drop-shadow(0 0 13px #ffe46d); } }
    @keyframes celebrate { 25% { transform: translateY(-13px) rotate(-8deg) scale(1.12); } 55% { transform: translateY(0) rotate(8deg); } }

    @media (max-width: 600px) {
      main { padding-top: 2rem; }
      .lane { height: 104px; }
      .runner { max-width: 7rem; }
      .name { max-width: 7rem; font-size: .8rem; }
      .rank { left: 8px; }
      .avatar { width: 48px; height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>🏁 Carrera de la competencia</h1>
        <p>Las soluciones avanzan con cada ejercicio resuelto.</p>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">Conectando con el marcador…</div>
    </header>
    <section class="track" id="track" aria-label="Pista y posiciones de los participantes">
      <div class="empty">Todavía no hay participantes en la pista.</div>
    </section>
    <section class="updates" aria-labelledby="updates-title">
      <h2 id="updates-title">Últimos avances</h2>
      <ul id="updates"><li>Esperando resultados…</li></ul>
    </section>
  </main>
  <script>
    const SCORE_URL = "score.json";
    const POLL_INTERVAL = 2000;
    const track = document.querySelector("#track");
    const status = document.querySelector("#status");
    const updates = document.querySelector("#updates");
    let seenEvents = null;
    let latestEvents = [];

    function render(data) {
      if (!Array.isArray(data.participants) || !Array.isArray(data.events)) {
        throw new Error("El formato del marcador no es válido.");
      }

      const participants = [...data.participants].sort((a, b) => a.rank - b.rank);
      track.replaceChildren();
      if (!participants.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Todavía no hay participantes en la pista.";
        track.append(empty);
      }

      for (const participant of participants) {
        const lane = document.createElement("div");
        lane.className = "lane";
        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = `#${participant.rank}`;

        const runner = document.createElement("div");
        runner.className = "runner";
        const ratio = participant.max_score > 0
          ? Math.max(0, Math.min(1, participant.score / participant.max_score))
          : 0;
        runner.style.setProperty("--progress", `${ratio * 100}%`);

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = participant.login;
        const avatar = document.createElement("img");
        avatar.className = "avatar";
        avatar.src = participant.avatar_url;
        avatar.alt = `Avatar de ${participant.login}`;
        avatar.loading = "lazy";
        avatar.referrerPolicy = "no-referrer";
        const score = document.createElement("span");
        score.className = "score";
        score.textContent = `${participant.score} / ${participant.max_score} pts`;

        runner.append(name, avatar, score);
        lane.append(rank, runner);
        track.append(lane);
      }

      latestEvents = data.events.slice(-8).reverse();
      updates.replaceChildren();
      if (!latestEvents.length) {
        const item = document.createElement("li");
        item.textContent = "Todavía no hay avances registrados.";
        updates.append(item);
      }
      for (const event of latestEvents) {
        const item = document.createElement("li");
        const description = event.type === "solved"
          ? `🎉 ${event.login} resolvió P${event.problem}`
          : `🏁 ${event.login} avanzó al puesto #${event.to_rank}${
              event.overtaken?.length ? `, superando a ${event.overtaken.join(", ")}` : ""
            }`;
        item.textContent = description;
        const date = document.createElement("time");
        date.dateTime = event.created_at;
        date.textContent = ` · ${new Date(event.created_at).toLocaleString("es")}`;
        item.append(date);
        updates.append(item);
      }

      if (seenEvents !== null) {
        const newEvents = data.events.filter(event => !seenEvents.has(event.id));
        for (const event of newEvents) {
          const index = participants.findIndex(p => p.login === event.login);
          const runner = track.children[index]?.querySelector(".runner");
          if (runner) {
            runner.classList.add(event.type === "solved" ? "celebrate" : "overtake");
            setTimeout(() => runner.classList.remove("celebrate", "overtake"), 1000);
          }
        }
      }
      seenEvents = new Set(data.events.map(event => event.id));
      const updated = data.updated_at ? new Date(data.updated_at).toLocaleTimeString("es") : "sin actividad";
      status.textContent = `Actualizado ${updated} · consulta cada 2 s`;
    }

    async function refresh() {
      try {
        const response = await fetch(`${SCORE_URL}?_=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`No se pudo leer score.json (${response.status}).`);
        render(await response.json());
      } catch (error) {
        status.textContent = `Error al actualizar: ${error.message}`;
      }
    }

    refresh();
    setInterval(refresh, POLL_INTERVAL);
  </script>
</body>
</html>

name: Notificar Resultados a Discord
on:
    workflow_run:
        workflows: ["Ejecutar Pruebas"]
        types: [completed]

jobs:
    notify:
        runs-on: ubuntu-latest
        permissions:
            actions: read
        if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
        steps:
            - name: Descargar artefacto
              uses: actions/download-artifact@v4
              with:
                name: test-results
                run-id: ${{ github.event.workflow_run.id }}
                github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Leer resultado y preparar mensaje
              id: leer
              run: |
                CONTENIDO=$(cat resultado.json)
                echo "resultado=$CONTENIDO" >> $GITHUB_OUTPUT

            - name: Enviar embed a Discord
              uses: tsickert/discord-webhook@v7.0.0
              with:
                webhook-url: ${{ secrets.DISCORD_WEBHOOK_RESULTS }}
                embed-title: "Resultado de la evaluacion"
                embed-description: "Participante: `${{ github.event.workflow_run.head_repository.owner.login }}` (${{ github.event.workflow_run.head_branch }})\nResultado: `${{ steps.leer.outputs.resultado }}`"
                embed-color: ${{ github.event.workflow_run.conclusion == 'success' && '3066993' || '15158332' }}
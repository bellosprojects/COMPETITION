name: Notificar Resultados a Discord
on:
  workflow_run:
    workflows: ["Ejecutar Pruebas"]
    types: [completed]

jobs:
  update-score:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      notify: ${{ steps.score.outputs.notify }}
      message: ${{ steps.score.outputs.message }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar marcador
        id: score
        env:
          PARTICIPANT_LOGIN: ${{ github.event.workflow_run.head_repository.owner.login }}
          PARTICIPANT_AVATAR: https://github.com/${{ github.event.workflow_run.head_repository.owner.login }}.png?size=160
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCORE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_score.py \
            --result resultado.json \
            --login "$PARTICIPANT_LOGIN" \
            --avatar "$PARTICIPANT_AVATAR" \
            --run-id "$RUN_ID" \
            --run-number "$RUN_NUMBER" \
            --repository "$REPOSITORY" \
            --branch "$DEFAULT_BRANCH" \
            --token "$SCORE_TOKEN" \
            --pages-score docs/score.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish-pages:
    needs: update-score
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Publicar GitHub Pages
        uses: actions/deploy-pages@v4

  notify-discord:
    needs: update-score
    runs-on: ubuntu-latest
    permissions: {}
    if: ${{ needs.update-score.outputs.notify == 'true' }}
    steps:
      - name: Notificar avances a Discord
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_RESULTS }}
          embed-title: "Avances de la competencia"
          embed-description: ${{ needs.update-score.outputs.message }}
          embed-color: "3066993"